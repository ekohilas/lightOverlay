/*/
 |  Settings gradle file for the Equipment Set Scroll mod.
 |  Shares the build logic in ../gradle/main.gradle with Light Overlay.
/*/


// ===== Mod info ===== //
def modInfo = [
        modID          : "ekohilas.equipmentsetscroll",
        modName        : "Equipment Set Scroll",
        modVersion     : "1.0",
        gameVersion    : "auto",
        modDescription : "Switch between equipment sets by scrolling horizontally",
        author         : "ekohilas",
        clientside     : true,
        modDependencies         : [],
        modOptionalDependencies : [],
]


// ===== Necesse game directory ===== //
//   "auto" to attempt searching in default locations
def gamePath = "auto"


// ===== Use decompiled sources ===== //
//   Can be overridden with -PuseDecompiledSources=false
def useDecompiledSources = true



// ===== Project name ===== //
rootProject.name = modInfo.modName


gradle.ext.modInfo = modInfo
gradle.ext.gamePath = gamePath
gradle.ext.useDecompiledSources = useDecompiledSources
